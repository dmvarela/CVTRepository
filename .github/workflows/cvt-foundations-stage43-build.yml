name: CVT Foundations Stage 4.3 manuscript build

on:
  pull_request:
    paths:
      - "research-hub/cvt-foundations/main.tex"
      - "research-hub/cvt-foundations/reviews/2026-07-22-claim-ledger.md"
      - ".github/workflows/cvt-foundations-stage43-build.yml"

permissions:
  contents: read

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-science

      - name: Compile manuscript twice
        working-directory: research-hub/cvt-foundations
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Enforce publication-form checks
        working-directory: research-hub/cvt-foundations
        shell: bash
        run: |
          if grep -Eq "LaTeX Warning: (Reference|Citation).*undefined" main.log; then
            echo "Undefined reference or citation detected."
            exit 1
          fi
          if grep -q "Overfull \\\\hbox" main.log; then
            echo "Overfull box detected."
            exit 1
          fi
          pdfinfo main.pdf

      - name: Render every PDF page
        working-directory: research-hub/cvt-foundations
        run: |
          mkdir -p rendered-pages
          pdftoppm -png -r 120 main.pdf rendered-pages/page

      - name: Upload build and rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: cvt-foundations-stage43-publication-form
          path: |
            research-hub/cvt-foundations/main.pdf
            research-hub/cvt-foundations/main.log
            research-hub/cvt-foundations/rendered-pages/
          if-no-files-found: error
          retention-days: 7

