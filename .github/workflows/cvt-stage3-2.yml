name: CVT Stage 3.2 validation comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "research-hub/cvt-foundations/validation/regulated-transport/**"
      - ".github/workflows/cvt-stage3-2.yml"

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: research-hub/cvt-foundations/validation/regulated-transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: research-hub/cvt-foundations/validation/regulated-transport/requirements.txt
      - name: Install frozen environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_stage31.py
          tests/test_stage32.py
          tests/test_stage32_runner.py
          tests/test_stage32_finalize.py
      - name: Restore frozen Stage 3.1 evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: cvt-stage3-1-sealed-evidence
          repository: dmvarela/CVTRepository
          run-id: 30966929493
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research-hub/cvt-foundations/validation/regulated-transport/results/stage3_1
      - name: Verify seal, fit candidates, and open validation once
        run: >-
          python -m src.stage32_runner
          --data results/stage3_1
          --output results/stage3_2
          --seal config/stage32_portable_seal.json
          --bootstrap-resamples 2000
      - name: Finalize strict JSON and lock hashes
        run: python -m src.stage32_finalize --output results/stage3_2
      - name: Record environment
        if: always()
        run: mkdir -p results/stage3_2 && python -m pip freeze > results/stage3_2/pip-freeze.txt
      - name: Upload locked comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvt-stage3-2-results
          path: research-hub/cvt-foundations/validation/regulated-transport/results/stage3_2/*
          if-no-files-found: warn
          retention-days: 30
