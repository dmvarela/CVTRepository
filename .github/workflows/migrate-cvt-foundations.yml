name: Migrate CVT Foundations

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science poppler-utils

      - name: Recover and verify canonical source
        run: python .github/scripts/migrate_cvt_foundations.py

      - name: Compile manuscript twice
        working-directory: research-hub/cvt-foundations
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Preserve and inspect canonical build
        run: |
          set -euo pipefail
          target="research-hub/cvt-foundations"
          milestone="$target/milestones/2026-07-22-canonicalization"
          cp "$target/main.pdf" "$milestone/cvt_foundations_2026-07-22.pdf"
          pages=$(pdfinfo "$target/main.pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" = "20"
          {
            echo "CVT Foundations canonicalization build"
            echo "Date: 2026-07-22"
            echo "Source: research-hub/cvt-foundations/main.tex"
            echo "Historical provenance: Coherence viability Theory/main.tex"
            echo "Pages: $pages"
            echo "Engine: $(pdflatex --version | head -n 1)"
          } > "$milestone/BUILD_REPORT.txt"
          (
            cd "$target"
            sha256sum main.tex milestones/2026-07-22-canonicalization/cvt_foundations_2026-07-22.pdf > milestones/2026-07-22-canonicalization/SHA256SUMS
          )
          rm -f "$target/main.aux" "$target/main.log" "$target/main.out" "$target/main.pdf"

      - name: Commit canonical manuscript and milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-hub/cvt-foundations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Canonicalize CVT Foundations manuscript"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
